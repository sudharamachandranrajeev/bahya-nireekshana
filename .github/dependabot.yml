# Keeps the commit-pinned actions in .github/workflows up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release before proposing it, so a compromised
    # release is likely caught and pulled before it reaches this repository.
    cooldown:
      default-days: 7
