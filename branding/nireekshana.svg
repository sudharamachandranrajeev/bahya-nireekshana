  <circle cx="256" cy="256" r="50" fill="none" stroke="#2FD3E0" stroke-opacity="0.5" stroke-width="6"/>
  <path d="M256 256 L 256 172 A 84 84 0 0 1 338 238 Z" fill="url(#sweep)"/>
  <!-- Download and upload. -->
  <path d="M226 226 v58 m-18 -20 l18 22 l18 -22" fill="none" stroke="#2FD3E0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M286 286 v-58 m-18 20 l18 -22 l18 22" fill="none" stroke="#FF8A3D" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
